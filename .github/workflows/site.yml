name: Project journal

on:
  pull_request:
    paths:
      - 'site/**'
      - 'README.md'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run readme:gallery -- --check
      - run: npm run build
      - run: npm run check:publication
      - name: Check Pages publishing source
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl -sS --max-time 30 -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200)
              echo "enabled=$(jq -r '.build_type == "workflow"' "$response")" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::notice::Pages has not been enabled for this repository.'
              ;;
            *)
              jq -r '.message // "Pages API request failed"' "$response" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site/dist/

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
