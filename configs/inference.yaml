runtime:
  backend: pytorch
  device: cpu
  amp: auto

checkpoints:
  localization: outputs/localization/nov26-baseline/best.pt
  damage: outputs/damage/nov28-class-cap/best.pt

localization:
  crop_size: 256
  minimum_component_area: 32

evaluation:
  match_iou_minimum: 0.5  # Inclusive.
  merge_gt_coverage_threshold: 0.5  # Strictly greater than.
  merge_min_buildings: 2

calibration:
  target_coverage: 0.80
  temperature: null
  oracle_threshold: null
  candidate_threshold: null
