[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-vision"
version = "0.1.0.dev0"
description = "Research scaffold for post-disaster building damage assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11.0",
    "PyYAML>=6.0.2",
    "shapely>=2.0.6",
]

[project.scripts]
aeris = "aeris.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]
report = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
